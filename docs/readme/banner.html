<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600&family=Barlow+Condensed:wght@600;700&family=Oswald:wght@700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1280px; height: 640px; background: #0E0A12; overflow: hidden; }
  .b { position: relative; width: 1280px; height: 640px; font-family: 'Barlow', sans-serif; color: #FBEFF7; }
  .shot { position: absolute; right: -40px; top: 70px; width: 760px; border-radius: 18px; overflow: hidden; border: 2px solid rgba(255,45,155,.55);
          transform: perspective(1400px) rotateY(-14deg) rotateX(4deg); box-shadow: 0 40px 90px rgba(0,0,0,.6), 0 0 60px rgba(255,45,155,.25); }
  .shot img { display: block; width: 100%; }
  .glow { position: absolute; inset: 0; background: radial-gradient(60% 70% at 85% 30%, rgba(255,45,155,.25), transparent 60%), radial-gradient(50% 60% at 0% 100%, rgba(185,140,240,.18), transparent 70%); }
  .fade { position: absolute; inset: 0; background: linear-gradient(90deg, #0E0A12 34%, rgba(14,10,18,.75) 52%, rgba(14,10,18,0) 75%); }
  .txt { position: absolute; left: 64px; top: 92px; width: 600px; }
  .badge { display: inline-flex; align-items: center; gap: 12px; padding: 6px 16px 6px 6px; border-radius: 99px; background: rgba(255,45,155,.12); border: 1px solid rgba(255,45,155,.55);
           font: 700 15px/1 'Barlow Condensed'; letter-spacing: .22em; text-transform: uppercase; }
  .badge img { width: 40px; height: 40px; border-radius: 50%; box-shadow: 0 0 0 2px #FF2D9B; }
  h1 { margin: 28px 0 0; font: 700 82px/.9 'Oswald'; text-transform: uppercase; letter-spacing: -.01em; }
  h1 span { color: #FF2D9B; }
  .sub { margin: 22px 0 0; font: 500 22px/1.4 'Barlow'; color: rgba(251,239,247,.86); }
  .slogan { margin: 18px 0 0; font: italic 600 20px/1.3 'Barlow'; color: #F7A8E0; }
  .tags { position: absolute; left: 64px; bottom: 56px; display: flex; gap: 10px; }
  .tags span { padding: 8px 14px; border-radius: 10px; border: 1px solid rgba(251,239,247,.18); background: rgba(25,18,31,.9); font: 700 14px/1 'Barlow Condensed'; letter-spacing: .14em; text-transform: uppercase; }
  .corner { position: absolute; width: 46px; height: 46px; border: 0 solid #FF2D9B; }
  .c1 { left: 22px; top: 22px; border-left-width: 3px; border-top-width: 3px; }
  .c2 { right: 22px; top: 22px; border-right-width: 3px; border-top-width: 3px; }
  .c3 { left: 22px; bottom: 22px; border-left-width: 3px; border-bottom-width: 3px; }
  .c4 { right: 22px; bottom: 22px; border-right-width: 3px; border-bottom-width: 3px; }
</style>
</head>
<body>
<div class="b">
  <div class="glow"></div>
  <div class="shot"><img src="../guia/img/14-en-vivo.jpeg" alt=""></div>
  <div class="fade"></div>
  <div class="txt">
    <span class="badge"><img src="../../assets/media/hush-icon.webp" alt="">Hush · GIS de buses</span>
    <h1>Cada bus,<br>cada cupo,<br><span>en el mapa.</span></h1>
    <p class="sub">Parqueaderos, ubicación de buses y puestos para el transporte intermunicipal de Cundinamarca.</p>
    <p class="slogan">“Reescribe las reglas del campo de batalla.”</p>
  </div>
  <div class="tags"><span>PostGIS</span><span>OpenStreetMap</span><span>Supabase</span><span>Three.js</span><span>Cordova</span></div>
  <span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>
</div>
</body>
</html>
