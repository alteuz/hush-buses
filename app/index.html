<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: gap: https://ssl.gstatic.com https:; style-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss:; media-src *">
  <meta name="theme-color" content="#0E0A12">
  <link rel="icon" type="image/webp" href="img/hush-icon.webp">
  <title>Hush · Centro de control</title>
  <meta name="description" content="Disponibilidad de parqueaderos, ubicación de buses, puestos y horarios de conductores para una empresa de transporte intermunicipal en Cundinamarca.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="shell" id="shell">

    <!-- ===== Top bar ===== -->
    <header class="topbar">
      <a class="brand" href="../index.html" target="_top" title="Volver a la página del proyecto">
        <img class="brand-mark" src="img/hush-icon.webp" alt="" width="30" height="30">
        <span class="brand-name">Hush<em>Buses</em></span>
      </a>
      <div class="kpis" id="kpis" aria-live="polite">
        <div class="kpi"><span class="kpi-v" data-k="free">—</span><span class="kpi-l">cupos libres</span></div>
        <div class="kpi"><span class="kpi-v" data-k="in_transit">—</span><span class="kpi-l">en ruta</span></div>
        <div class="kpi"><span class="kpi-v" data-k="departures_next_hour">—</span><span class="kpi-l">salidas · 1 h</span></div>
        <div class="kpi"><span class="kpi-v" data-k="drivers_on_duty">—</span><span class="kpi-l">conductores en turno</span></div>
      </div>
      <div class="top-right">
        <span class="clock" id="clock">--:--</span>
        <span class="status" id="status"><i></i><b>Conectando</b></span>
        <button class="icon-btn" id="btn-refresh" title="Actualizar datos" aria-label="Actualizar datos"><i class="ph ph-arrows-clockwise"></i></button>
        <button class="icon-btn" id="btn-reset" title="Regenerar operaciones de demostración" aria-label="Regenerar operaciones de demostración"><i class="ph ph-arrow-counter-clockwise"></i></button>
      </div>
    </header>

    <!-- ===== Map ===== -->
    <main class="map-wrap">
      <div id="map" role="application" aria-label="Mapa de parqueaderos y buses en Cundinamarca"></div>
      <div class="legend">
        <span><i class="dot ok"></i>Cupos libres</span>
        <span><i class="dot mid"></i>Llenándose</span>
        <span><i class="dot full"></i>Lleno</span>
        <span><i class="ph-fill ph-bus"></i>Bus en ruta (estimado)</span>
      </div>
      <button class="locate-btn" id="btn-locate" title="Terminal más cercana a mí"><i class="ph ph-crosshair"></i></button>
    </main>

    <!-- ===== Side panel / bottom sheet ===== -->
    <aside class="panel" id="panel">
      <button class="sheet-handle" id="sheet-handle" aria-label="Expandir panel"><span></span></button>

      <nav class="tabs" role="tablist">
        <button class="tab is-active" data-tab="lots" role="tab"><i class="ph ph-garage"></i><span>Terminales</span></button>
        <button class="tab" data-tab="fleet" role="tab"><i class="ph ph-bus"></i><span>Flota</span></button>
        <button class="tab" data-tab="ops" role="tab"><i class="ph ph-clipboard-text"></i><span>Registrar</span></button>
        <button class="tab" data-tab="seats" role="tab"><i class="ph ph-armchair"></i><span>Puestos</span></button>
        <button class="tab" data-tab="drivers" role="tab"><i class="ph ph-steering-wheel"></i><span>Conductores</span></button>
      </nav>

      <div class="views">
        <!-- Terminals -->
        <section class="view is-active" data-view="lots">
          <form class="search" id="geo-form" autocomplete="off">
            <i class="ph ph-magnifying-glass"></i>
            <input id="geo-input" type="search" placeholder="Buscar un lugar en Cundinamarca…" aria-label="Buscar un lugar">
            <button type="submit" class="search-go" aria-label="Buscar"><i class="ph ph-arrow-right"></i></button>
          </form>
          <div id="geo-results"></div>
          <div id="lots-body"></div>
        </section>

        <!-- Fleet -->
        <section class="view" data-view="fleet">
          <div class="view-head">
            <h2>Flota</h2>
            <div class="chips" id="fleet-filter">
              <button class="chip is-active" data-f="ALL">Todos</button>
              <button class="chip" data-f="PARKED">Parqueados</button>
              <button class="chip" data-f="IN_TRANSIT">En ruta</button>
            </div>
          </div>
          <div id="fleet-body" class="list"></div>
        </section>

        <!-- Register -->
        <section class="view" data-view="ops">
          <div class="view-head">
            <h2>Registrar</h2>
            <p class="hint">Administrador del parqueadero · llegadas, salidas e información de los viajes.</p>
          </div>
          <div class="seg" id="ops-seg">
            <button class="is-active" data-op="arrival"><i class="ph ph-sign-in"></i>Llegada</button>
            <button data-op="departure"><i class="ph ph-sign-out"></i>Salida</button>
            <button data-op="trip"><i class="ph ph-path"></i>Nuevo viaje</button>
          </div>

          <form class="form" id="form-arrival" data-op="arrival">
            <label>Parqueadero<select name="lot" required></select></label>
            <label>Actuando como<select name="user"></select></label>
            <label>Bus<select name="bus" required></select></label>
            <div class="form-note" data-note></div>
            <label>Hora de llegada<input type="datetime-local" name="at" required></label>
            <button class="btn-primary" type="submit"><i class="ph ph-sign-in"></i>Registrar llegada</button>
          </form>

          <form class="form" id="form-departure" data-op="departure" hidden>
            <label>Parqueadero<select name="lot" required></select></label>
            <label>Actuando como<select name="user"></select></label>
            <label>Bus parqueado<select name="bus" required></select></label>
            <label>Viaje<select name="trip"></select></label>
            <div class="form-note" data-note></div>
            <label>Hora de salida<input type="datetime-local" name="at" required></label>
            <button class="btn-primary" type="submit"><i class="ph ph-sign-out"></i>Registrar salida</button>
          </form>

          <form class="form" id="form-trip" data-op="trip" hidden>
            <label>Bus<select name="bus" required></select></label>
            <label>Conductor<select name="driver"></select></label>
            <div class="row2">
              <label>Origen<select name="origin" required></select></label>
              <label>Destino<select name="destination" required></select></label>
            </div>
            <div class="row2">
              <label>Salida del origen<input type="datetime-local" name="departure" required></label>
              <label>Llegada al destino<input type="datetime-local" name="arrival" required></label>
            </div>
            <label>Permanencia en el parqueadero (min)<input type="number" name="dwell" min="0" max="1440" step="5" value="45" required></label>
            <div class="form-note" data-note></div>
            <button class="btn-primary" type="submit"><i class="ph ph-path"></i>Registrar viaje</button>
          </form>
        </section>

        <!-- Seats -->
        <section class="view" data-view="seats">
          <div class="view-head">
            <h2>Puestos por bus</h2>
            <label class="inline-select">Viaje<select id="seat-trip"></select></label>
          </div>
          <div id="seat-body"></div>
        </section>

        <!-- Drivers -->
        <section class="view" data-view="drivers">
          <div class="view-head">
            <h2>Horarios de conductores</h2>
            <label class="inline-select">Base<select id="driver-lot"><option value="">Todas las terminales</option></select></label>
          </div>
          <div id="driver-body"></div>
        </section>
      </div>
    </aside>

    <div class="toasts" id="toasts" aria-live="assertive"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
  <script src="js/bus3d.js"></script>
  <script src="js/live.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
